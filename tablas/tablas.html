<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla del 3</title>
    <link rel="stylesheet" href="tablas.css">
</head>
<body>
    <h1 class="titulo">Tablas de Multiplicar</h1>

    <header class="header">
        <h2 class="logo">BUSCAR TABLA</h2>

        <div class="buscador">
            <input type="number" placeholder="ingresa el valor" class="input-neon" id="valorIngresado">
            <button onclick="generar()" class="btn-neon">BUSCAR</button>
        </div>
    </header>

    <main>

        <div class="tabla" id="tablas">
            <div class="fila">3 x 1 = 3</div>
            <div class="fila">3 x 2 = 6</div>
            <div class="fila">3 x 3 = 9</div>
            <div class="fila">3 x 4 = 12</div>
            <div class="fila">3 x 5 = 15</div>
            <div class="fila">3 x 6 = 18</div>
            <div class="fila">3 x 7 = 21</div>
            <div class="fila">3 x 8 = 24</div>
            <div class="fila">3 x 9 = 27</div>
            <div class="fila">3 x 10 = 30</div>
        </div>
    </main>
<script src="tablas.js"></script>

</body>
</html>
